name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Android SDK and NDK come preinstalled on ubuntu-latest.
    steps:
      - uses: actions/checkout@v4
      # Java 17: newer JDKs make apksigner print "restricted method" warnings.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Create temporary signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -alias famtree \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=FamTree CI"
      - name: Build APK
        working-directory: android
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/ci.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          # ANDROID_SDK_ROOT is deprecated; ANDROID_HOME is already set on the runner.
          unset ANDROID_SDK_ROOT
          cargo apk build --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: famtree-android
          path: android/target/release/apk/*.apk
