[package]
name = "famtree_android"
version = "1.0.0"
edition = "2021"
description = "Read-only Android viewer for FamTree family trees"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/john3sobieski/family-tree"

# Own workspace root: keeps this crate independent from the desktop crate in the repo root.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
winit = { version = "0.30", features = ["android-native-activity"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Settings for cargo-apk.
[package.metadata.android]
package = "io.github.john3sobieski.famtree"
apk_name = "FamTree"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 34

[package.metadata.android.application]
label = "FamTree"

[package.metadata.android.application.activity]
orientation = "unspecified"
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode"
