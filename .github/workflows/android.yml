name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/scripts/**"
      # Shared desktop files (layout, view, flags, theme, ...) are compiled into the app too.
      - "src/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Android SDK and NDK come preinstalled on ubuntu-latest.
    steps:
      - uses: actions/checkout@v4
      # Java 17: newer JDKs make apksigner print "restricted method" warnings.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Create temporary signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -alias famtree \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=FamTree CI"
      - name: Patch winit (system Back must reach the activity)
        working-directory: android
        run: |
          set -euo pipefail
          # winit 0.30 reports every key, Back included, as handled, so Activity.onBackPressed is never called.
          # Copy the exact winit that cargo resolves, make Back "unhandled", and point cargo at the copy.
          cargo fetch --target aarch64-linux-android
          SRC=$(cargo metadata --format-version 1 --filter-platform aarch64-linux-android | python3 -c "import sys, json; m = json.load(sys.stdin); print([p['manifest_path'] for p in m['packages'] if p['name'] == 'winit' and p['version'].startswith('0.30.')][0])")
          rm -rf "$RUNNER_TEMP/winit-patched"
          cp -r "$(dirname "$SRC")" "$RUNNER_TEMP/winit-patched"
          python3 ../.github/scripts/patch_winit.py "$RUNNER_TEMP/winit-patched/src/platform_impl/android/mod.rs"
          printf '\n[patch.crates-io]\nwinit = { path = "%s" }\n' "$RUNNER_TEMP/winit-patched" >> Cargo.toml
          tail -4 Cargo.toml
      - name: Build APK
        working-directory: android
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/ci.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          # ANDROID_SDK_ROOT is deprecated; ANDROID_HOME is already set on the runner.
          unset ANDROID_SDK_ROOT
          cargo apk build --release
      - name: Add Java layer (classes.dex) and sign
        working-directory: android
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          rm -rf build dist
          mkdir -p build/classes build/dex dist
          # Version of the Android crate (android/Cargo.toml), not of the desktop one.
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK version: $VERSION"
          javac --release 11 -classpath "$JAR" -d build/classes $(find java -name '*.java')
          "$BT/d8" --lib "$JAR" --min-api 29 --output build/dex $(find build/classes -name '*.class')
          # cargo-apk built an APK without code: copy it without the old signature and add classes.dex.
          python3 - <<'PYEOF'
          import glob, zipfile
          src = glob.glob("target/release/apk/*.apk")[0]
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile("build/unsigned.apk", "w") as zout:
              for zi in zin.infolist():
                  if zi.filename.startswith("META-INF/"):
                      continue
                  zout.writestr(zi, zin.read(zi.filename), compress_type=zi.compress_type)
              zout.write("build/dex/classes.dex", "classes.dex", compress_type=zipfile.ZIP_DEFLATED)
          PYEOF
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ci.keystore" --ks-pass pass:android --key-pass pass:android --out "dist/FamTree-$VERSION.apk" build/aligned.apk
          "$BT/apksigner" verify --verbose "dist/FamTree-$VERSION.apk"
          # Shows package, versionName and the icon the APK really contains.
          "$BT/aapt2" dump badging "dist/FamTree-$VERSION.apk" | grep -E "^(package|application-label|application-icon)" || true
          unzip -l "dist/FamTree-$VERSION.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: famtree-android-${{ env.VERSION }}
          path: android/dist/FamTree-${{ env.VERSION }}.apk
