[package]
name = "famtree"
version = "1.1.0"
edition = "2021"
description = "Desktop family tree editor and viewer for Windows"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/john3sobieski/family-tree"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"
